name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run unit tests with branch coverage
      run: python -m coverage run --branch --source=src,data,db -m unittest discover -s . -p "test_*.py"

    - name: Report coverage
      if: always()
      run: python -m coverage report --show-missing

    - name: Enforce coverage floor
      if: success() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'coverage-exempt')
      run: python -m coverage report --fail-under=90
